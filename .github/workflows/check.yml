name: check

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install mise and tools
        uses: jdx/mise-action@v5

      - name: Install dependencies and generate API SDK
        run: mise run setup

      - name: Run all checks
        run: mise run check
